name: Deploy wedding invitation to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/rakshith-arpitha-react-invitation/package-lock.json

      - name: Verify ZIP file
        run: |
          echo "Checking ZIP file..."
          ls -lah
          test -f Rakshith_Arpitha_React_Invitation_Realistic.zip
          unzip -t Rakshith_Arpitha_React_Invitation_Realistic.zip

      - name: Extract React project
        run: |
          mkdir -p app
          unzip -q Rakshith_Arpitha_React_Invitation_Realistic.zip -d app

          echo "Extracted project files:"
          ls -lah app

          test -f app/rakshith-arpitha-react-invitation/package.json

      - name: Install dependencies
        working-directory: app/rakshith-arpitha-react-invitation
        run: npm install

      - name: Build React application
        working-directory: app/rakshith-arpitha-react-invitation
        run: npm run build

      - name: Verify build output
        run: |
          test -f app/rakshith-arpitha-react-invitation/dist/index.html
          echo "Build completed successfully!"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/rakshith-arpitha-react-invitation/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
